        <details id="lpBox" class="chbox"> <!-- v4.19: 🪄 living pictures -->
          <summary>🪄 Living pictures — the Flow picture itself moves: talking, blinking, fire, water, vehicles …</summary>
          <div class="row wrap"><label class="small">Mode <select id="lpMode"><option value="off">Off (zoom / pan only, as before)</option><option value="on">🪄 On — read every picture and move what can move</option></select></label>
          <label class="small">Strength <select id="lpStrength"><option value="60">Light</option><option value="100">Normal</option><option value="140">Strong</option></select></label></div>
          <p id="lpInfo" class="muted small"></p>
          <div id="lpOpts">
            <div class="row wrap"><label class="check small"><input id="lpTalk" type="checkbox" /> 👄 Speaker's mouth with the voice</label><label class="check small"><input id="lpBlink" type="checkbox" /> 👁 Blinking</label><label class="check small"><input id="lpBreath" type="checkbox" /> 🫁 Breathing / small head moves</label></div>
            <div class="row wrap"><label class="check small"><input id="lpNature" type="checkbox" /> 🔥 Fire, smoke, water, leaves, clouds, flags, diya</label><label class="check small"><input id="lpVehicle" type="checkbox" /> 🚗 Vehicles: wheels turn, shake, dust, camera follows</label><label class="check small"><input id="lpWalk" type="checkbox" /> 🚶 Walking people: step bob, camera follows</label></div>
            <div class="row wrap"><button id="lpReadBtn" class="ghost small-btn">👁 Read all pictures again (Gemini)</button></div>
            <canvas id="lpPrev" width="640" height="360" style="width:100%;border-radius:8px;background:#111;cursor:crosshair"></canvas>
            <div class="row wrap"><select id="lpScene" class="grow"></select><button id="lpPrevBtn" class="ghost small-btn">▶ Preview</button><label class="check small"><input id="lpMarks" type="checkbox" checked /> show what was found</label></div>
            <p class="muted small">Wrong spot? Click the picture where the speaker's mouth is (Shift + click = an eye). One picture cannot make legs step or a car drive away; for that use a walk sheet or Veo.</p>
          </div>
        </details>
