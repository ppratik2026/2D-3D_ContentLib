<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Video Studio</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#2a2f3c;--txt:#e9ecf2;--mut:#9aa3b5;--acc:#ffb547;--ok:#4cd486;--err:#ff6b6b}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--card:#fff;--line:#dde1ea;--txt:#151821;--mut:#5d6577;--acc:#d97b00}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:12px 0 6px}select,input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit}
select option{background:var(--card)}textarea{min-height:70px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none}.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.range{display:flex;gap:12px;align-items:center}.range input{flex:1}.big{font-size:34px;font-weight:800;color:var(--acc)}
.est td{padding:3px 10px 3px 0;color:var(--mut)}.est td:last-child{color:var(--txt);text-align:right}
button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#1b1300;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:var(--acc);width:0}
pre{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;font-size:12px;color:var(--mut);white-space:pre-wrap}
video{width:100%;border-radius:12px;margin-top:10px;background:#000}.warn{color:var(--err)}.note{color:var(--mut);font-size:13px}a{color:var(--acc)}
</style></head><body><main>
<h1>🎬 Auto Video Studio</h1>
<p class="sub">Category chuno → Gemini story likhega → Hindi awaaz, music, subtitles → Three.js + Remotion se final video. Sab free, bina GPU.</p>
<div class="grid">
  <div class="card">
    <label>1. Category</label><div class="cats" id="cats"></div>
    <label>2. Apna idea / title (optional)</label><textarea id="idea" placeholder="Khali chhodoge to Gemini khud naya idea banayega"></textarea>
    <label>3. Kitne minute ka video</label><div class="range"><input type="range" id="min" min="0.5" max="15" step="0.5" value="2"><b id="minv">2 min</b></div>
    <label>4. Style</label><select id="style"></select>
    <label>5. Look</label><select id="look"></select>
    <label>6. Subtitles</label><select id="subs"></select>
    <label><input type="checkbox" id="demo" style="width:auto"> Demo story (bina Gemini key ke test)</label>
  </div>
  <div class="card">
    <div class="note">Estimated time (is PC pe)</div><div class="big" id="total">–</div>
    <table class="est" id="parts"></table><div class="note" id="measured"></div>
    <div id="keywarn" class="warn" style="display:none">.env file me GEMINI_API_KEY nahi mili. Demo story se test kar sakte ho.</div>
    <button id="go">Video banao</button>
    <div id="job" style="display:none"><div class="bar"><div id="prog"></div></div><div id="msg"></div><pre id="log"></pre><div id="result"></div></div>
  </div>
</div></main>
<script>
const $ = (i) => document.getElementById(i); let O, cat = 'romance';
const fill = (sel, obj, auto) => { sel.innerHTML = (auto ? '<option value="auto">Auto (category ke hisaab se)</option>' : '') + Object.entries(obj).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join(''); };
async function init() {
  O = await (await fetch('/api/options')).json();
  $('cats').innerHTML = Object.entries(O.categories).map(([k, v]) => `<span class="chip${k === cat ? ' on' : ''}" data-k="${k}">${v.label}</span>`).join('');
  $('cats').onclick = (e) => { const k = e.target.dataset.k; if (!k) return; cat = k; [...$('cats').children].forEach((c) => c.classList.toggle('on', c.dataset.k === k)); };
  fill($('style'), O.styles); fill($('look'), O.looks, true); fill($('subs'), O.subs, true);
  if (!O.hasKey) { $('keywarn').style.display = 'block'; $('demo').checked = true; }
  for (const id of ['min', 'style']) $(id).oninput = est; est();
}
async function est() {
  const m = $('min').value; $('minv').textContent = m + ' min';
  const e = await (await fetch(`/api/estimate?style=${$('style').value}&minutes=${m}`)).json();
  $('total').textContent = e.totalText;
  const names = { story: 'Story (Gemini)', voice: 'Hindi awaaz (Piper)', sound: 'Music + effects', prepare: 'Taiyaari', render: '3D render' };
  $('parts').innerHTML = Object.entries(e.partsText).map(([k, v]) => `<tr><td>${names[k]}</td><td>${v}</td></tr>`).join('');
  $('measured').textContent = e.measured ? 'Is PC pe pichhli render ki speed se naapa gaya.' : 'Andaza hai. Pehli video ke baad is PC ki asli speed se aur sahi hoga.';
}
$('go').onclick = async () => {
  $('go').disabled = true; $('job').style.display = 'block'; $('result').innerHTML = '';
  const body = { category: cat, idea: $('idea').value, minutes: $('min').value, style: $('style').value, look: $('look').value, subs: $('subs').value, demo: $('demo').checked };
  const { id } = await (await fetch('/api/make', { method: 'POST', body: JSON.stringify(body) })).json();
  const poll = async () => { const j = await (await fetch('/api/job/' + id)).json();
    $('msg').textContent = j.msg || j.status; $('log').textContent = (j.log || []).join('\n'); $('log').scrollTop = 1e9;
    $('prog').style.width = ((j.step === 'render' ? 0.3 + 0.7 * (j.progress || 0) : j.step === 'done' ? 1 : { plan: 0.02, story: 0.1, voice: 0.2, sound: 0.28 }[j.step] || 0) * 100) + '%';
    if (j.status === 'done') { $('result').innerHTML = `<video controls src="${j.file}"></video><p><a href="${j.file}" download>⬇ Video download</a> · <a href="${j.srt}" download>Subtitles (.srt)</a></p>`; $('go').disabled = false; return; }
    if (j.status === 'error') { $('msg').innerHTML = `<span class="warn">Error: ${j.error}</span>`; $('go').disabled = false; return; }
    setTimeout(poll, 1500); };
  poll();
};
init();
</script></body></html>
